resources:
  volumes:
    landing_volume:
      name: landing
      catalog_name: osrs_analytics_${var.env_name}
      schema_name: stage
      volume_type: MANAGED
      comment: Raw landing files

    processed_volume:
      name: processed
      catalog_name: osrs_analytics_${var.env_name}
      schema_name: stage
      volume_type: MANAGED
      comment: Staging area for processed files

    analytics_pricing_volume:
      name: pricing_history
      catalog_name: osrs_analytics_${var.env_name}
      schema_name: analytics
      volume_type: MANAGED
      comment: Analytics data

    configuration_volume:
      name: configuration
      catalog_name: osrs_analytics_${var.env_name}
      schema_name: analytics
      volume_type: MANAGED
      comment: Configuration data