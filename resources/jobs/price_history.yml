resources:
  jobs:
    price_history:
      name: load_price_history

      email_notifications:
        on_failure:
          - ${var.notification_email}
      notification_settings:
        no_alert_for_skipped_runs: false

      schedule:
        quartz_cron_expression: "1 30 0 * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}

      queue:
        enabled: true

      tasks:
        - task_key: ge_price_data_24h
          spark_python_task:
            python_file: ${workspace.file_path}/src/extract/ge_price_data_24h.py
            parameters:
              - "--landing-root"
              - "/Volumes/${var.catalog}/raw/landing/ge_price_24h"
              - "--date"
              - "{{job.start_time.iso_date}}"
          environment_key: Default

        - task_key: stage_price_data
          depends_on:
            - task_key: ge_price_data_24h
          spark_python_task:
            python_file: ${workspace.file_path}/src/transform/stage_ge_price_data.py
            parameters:
              - "--landing-root"
              - "/Volumes/${var.catalog}/raw/landing/ge_price_24h"
              - "--output-root"
              - "/Volumes/${var.catalog}/raw/stage/ge_price_24h"
              - "--date"
              - "{{job.start_time.iso_date}}"
          environment_key: Default

      environments:
        - environment_key: Default
          spec:
            environment_version: "3"
            dependencies:
              - requests
              - pandas
              - pyarrow