resources:
  jobs:
    price_history:
      name: load_price_history

      email_notifications:
        on_failure:
          - ${var.notification_email}
        no_alert_for_skipped_runs: true

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}

      queue:
        enabled: true

      tasks:
        - task_key: ge_price_data_24h
          spark_python_task:
            python_file: ${workspace.file_path}/src/extract/ge_price_data_24h.py
            python_path:
              - ${workspace.file_path}
            parameters:
              - "--landing-root"
              - "/Volumes/${var.catalog}/raw/landing/ge_price_24h"
          environment_key: Default

      environments:
        - environment_key: Default
          spec:
            client: "3"
            dependencies:
              - requests