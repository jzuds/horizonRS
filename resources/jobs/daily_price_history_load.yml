resources:
  jobs:
    price_history:
      name: load_full_daily_price_history

      parameters:
        - name: processing_date
          default: ""

      email_notifications:
        on_failure:
          - ${var.notification_email}

      notification_settings:
        no_alert_for_skipped_runs: false

      schedule:
        quartz_cron_expression: "0 10 0 * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}

      queue:
        enabled: true

      tasks:

        # ----------------------------
        # 24H EXTRACT
        # ----------------------------
        - task_key: ge_price_data_24h

          spark_python_task:
            python_file: ${workspace.file_path}/src/extract/extract_ge_price_data.py
            parameters:
              - "--granularity"
              - "24h"
              - "--landing-root"
              - "/Volumes/osrs_analytics_${var.env_name}/stage/landing/pricing/granularity=24h"
              - "--date"
              - "{{job.parameters.processing_date}}"

          environment_key: Default


        # ----------------------------
        # 24H STAGE
        # ----------------------------
        - task_key: stage_price_data_24h

          depends_on:
            - task_key: ge_price_data_24h

          spark_python_task:
            python_file: ${workspace.file_path}/src/extract/stage_ge_price_data.py
            parameters:
              - "--granularity"
              - "24h"
              - "--landing-root"
              - "/Volumes/osrs_analytics_${var.env_name}/stage/landing/pricing/granularity=24h"
              - "--output-root"
              - "/Volumes/osrs_analytics_${var.env_name}/stage/processed/pricing/granularity=24h"
              - "--date"
              - "{{job.parameters.processing_date}}"

          environment_key: Default


        # ----------------------------
        # 5M EXTRACT
        # ----------------------------
        - task_key: ge_price_data_5m

          depends_on:
            - task_key: stage_price_data_24h

          spark_python_task:
            python_file: ${workspace.file_path}/src/extract/extract_ge_price_data.py
            parameters:
              - "--granularity"
              - "5m"
              - "--landing-root"
              - "/Volumes/osrs_analytics_${var.env_name}/stage/landing/pricing/granularity=5m"
              - "--date"
              - "{{job.parameters.processing_date}}"

          environment_key: Default


        # ----------------------------
        # 5M STAGE
        # ----------------------------
        - task_key: stage_price_data_5m

          depends_on:
            - task_key: ge_price_data_5m

          spark_python_task:
            python_file: ${workspace.file_path}/src/extract/stage_ge_price_data.py
            parameters:
              - "--granularity"
              - "5m"
              - "--landing-root"
              - "/Volumes/osrs_analytics_${var.env_name}/stage/landing/pricing/granularity=5m"
              - "--output-root"
              - "/Volumes/osrs_analytics_${var.env_name}/stage/processed/pricing/granularity=5m"
              - "--date"
              - "{{job.parameters.processing_date}}"

          environment_key: Default


        # ----------------------------
        # 1H EXTRACT
        # ----------------------------
        - task_key: ge_price_data_1h

          depends_on:
            - task_key: stage_price_data_24h

          spark_python_task:
            python_file: ${workspace.file_path}/src/extract/extract_ge_price_data.py
            parameters:
              - "--granularity"
              - "1h"
              - "--landing-root"
              - "/Volumes/osrs_analytics_${var.env_name}/stage/landing/pricing/granularity=1h"
              - "--date"
              - "{{job.parameters.processing_date}}"

          environment_key: Default


        # ----------------------------
        # 1H STAGE
        # ----------------------------
        - task_key: stage_price_data_1h

          depends_on:
            - task_key: ge_price_data_1h

          spark_python_task:
            python_file: ${workspace.file_path}/src/extract/stage_ge_price_data.py
            parameters:
              - "--granularity"
              - "1h"
              - "--landing-root"
              - "/Volumes/osrs_analytics_${var.env_name}/stage/landing/pricing/granularity=1h"
              - "--output-root"
              - "/Volumes/osrs_analytics_${var.env_name}/stage/processed/pricing/granularity=1h"
              - "--date"
              - "{{job.parameters.processing_date}}"

          environment_key: Default


      environments:
        - environment_key: Default
          spec:
            environment_version: "3"
            dependencies:
              - requests
              - pandas
              - pyarrow