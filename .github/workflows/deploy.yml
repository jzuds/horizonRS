name: Deploy OSRS GE Pipeline

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"

jobs:
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: databricks/setup-cli@main

      - name: Validate
        run: databricks bundle validate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy:
    name: Setup environment and deploy
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v5

      - name: Determine deployment environment
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r setup/requirements.txt

      - uses: databricks/setup-cli@main

      - name: Initialize catalogs, schemas, and volumes
        run: python setup/init_env.py --env $DEPLOY_ENV
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy bundle
        run: databricks bundle deploy -t $DEPLOY_ENV --auto-approve
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}