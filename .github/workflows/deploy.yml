name: Deploy OSRS GE Pipeline

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"

concurrency:
  group: osrs-ge-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: databricks/setup-cli@v1.6.0

      - name: Validate
        run: databricks bundle validate -t ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

  deploy:
    name: Deploy OSRS GE Pipeline
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v5

      - name: Determine deployment environment
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
          fi

      - uses: databricks/setup-cli@v1.6.0

      - name: Deploy bundle
        run: databricks bundle deploy -t $DEPLOY_ENV --auto-approve